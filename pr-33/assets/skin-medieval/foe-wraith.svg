<!-- Spectre — le contrôle ne l'atteint pas. Pas de jambes : un linceul effilé
     qui flotte, seule silhouette du bestiaire à ne pas toucher le sol. Bleu
     glacé pour dire « le froid ne mord pas ce qui est déjà gelé ». -->
